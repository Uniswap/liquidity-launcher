[profile.default]
optimizer_runs = 200
src = "src"
out = "out"
libs = ["lib"]
bytecode_hash = "none"
verbosity = 2
fs_permissions = [
  { access = "read-write", path = ".forge-snapshots"},
  { access = "read", path = "script/" }
]
ffi = true

[profile.default.fuzz]
runs = 1000

[profile.pr.fuzz]
runs = 10000

[profile.ci.fuzz]
runs = 100000

[profile.debug]
via_ir = false
optimizer_runs = 200
fuzz.runs = 100

[profile.doc]
test = "none"
script = "none"

[lint]
lint_on_build = false

[fmt]
line_length = 120
tab_width = 4
quote_style = "single"
sort_imports = true
number_underscore = "thousands"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
